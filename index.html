<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملابس الأندلس mini prix | أناقة عصرية بأثمنة مناسبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #f0f2f6;
      --text: #14181f;
      --muted: #5c6573;
      --primary: #0f4c5c;
      --primary-dark: #093540;
      --accent: #e36414;
      --whatsapp: #16a34a;
      --whatsapp-dark: #15803d;
      --border: #e2e6ee;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Cairo", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 70px;
      padding: 8px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .cart-btn:hover {
      background: var(--primary-dark);
    }

    .cart-btn:active {
      transform: scale(0.98);
    }

    .cart-count {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    /* Hero */
    .hero {
      margin: 18px 0;
      background: linear-gradient(135deg, #0f4c5c 0%, #1b6b7d 60%, #243b4a 100%);
      color: #fff;
      border-radius: 22px;
      padding: 26px 22px;
      box-shadow: var(--shadow);
    }

    .hero-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: clamp(1.45rem, 3.2vw, 2.15rem);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .hero p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      max-width: 680px;
      margin-bottom: 16px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .hero-pill {
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 10px;
    }

    /* Controls: Search & Categories */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .cat-btn:hover {
      border-color: var(--primary);
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Products Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 18px;
      margin-bottom: 36px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.09);
    }

    .img-wrap {
      position: relative;
      aspect-ratio: 4 / 4.3;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cat-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(20, 24, 31, 0.78);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .select-box {
      width: 100%;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      outline: none;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 6px;
    }

    .price {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-wa {
      background: var(--whatsapp);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 9px 12px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.18s ease;
    }

    .btn-wa:hover {
      background: var(--whatsapp-dark);
    }

    .btn-add {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 12px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-add:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      color: var(--muted);
    }

    /* Cart Drawer / Modal */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.52);
      z-index: 60;
      display: none;
      justify-content: flex-start;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .drawer-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-head h2 {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .close-btn {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .drawer-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--bg);
    }

    .cart-item img {
      width: 58px;
      height: 66px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
      font-size: 0.85rem;
    }
